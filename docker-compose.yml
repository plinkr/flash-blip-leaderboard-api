version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: leaderboard_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flash-blip-leaderboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: leaderboard_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@db:5432/flash-blip-leaderboard?sslmode=disable
      - RATE_LIMIT_RPM=5
      - TIMESTAMP_SKEW_SECONDS=60
    depends_on:
      - db

volumes:
  postgres_data:
