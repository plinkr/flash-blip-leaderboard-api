services:
  db:
    image: postgres:15-alpine
    container_name: leaderboard_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flash-blip-leaderboard
    ports:
      - "127.0.0.1:5432:5432" # localhost-only, reachable by host and app service
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d flash-blip-leaderboard" ]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: leaderboard_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/flash-blip-leaderboard?sslmode=disable"
      RATE_LIMIT_RPM: "5"
      TIMESTAMP_SKEW_SECONDS: "60"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: